# Publie le miroir GitHub Pages à chaque envoi sur main.
# L'adresse principale (https://wordwizard.cabrelfosso.com/) est publiée par Cloudflare Pages.
# D'après le guide officiel de Vite : https://vite.dev/guide/static-deploy (section GitHub Pages).
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Miroir GitHub Pages : le site est servi sous /compilerProject/.
      - run: npm run check
        env:
          BASE_PATH: /compilerProject/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v5
